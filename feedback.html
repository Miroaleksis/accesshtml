<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessibility Feedback | AccessHTML.com</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="images/Favicon.png" type="image/png" sizes="48x48">
</head>
<body>

  <site-header></site-header>

  <div class="page-inner">

    <main class="page-content" id="main-content" tabindex="-1">

      <div class="page-description">
        <h1>Accessibility Feedback</h1>
        <p>The feedback form is coming soon.</p>
        <form class="feedback-form">
          <fieldset disabled>
            <legend>Accessibility feedback</legend>
            <div class="form-field">
              <label for="feedback-page">Where did you notice the issue?</label>
              <input type="text" id="feedback-page" aria-describedby="feedback-page-hint">
              <p class="form-hint" id="feedback-page-hint">For example a page address or the name of a pattern.</p>
            </div>
            <div class="form-field">
              <label for="feedback-description">Describe the issue (required)</label>
              <textarea id="feedback-description" rows="5" required aria-describedby="feedback-description-hint"></textarea>
              <p class="form-hint" id="feedback-description-hint">Describe the issue as precisely as possible.</p>
            </div>
            <div class="form-field">
              <label for="feedback-email">Your email address</label>
              <input type="email" id="feedback-email" autocomplete="email" aria-describedby="feedback-email-hint">
              <p class="form-hint" id="feedback-email-hint">Only needed if you want a reply.</p>
            </div>
            <button type="submit" class="button">Send feedback</button>
          </fieldset>
        </form>
      </div>

    </main>

  </div>
  <site-footer></site-footer>

  <script src="common.js"></script>

</body>
</html>
